[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "netshow"
version = "0.3.0"
description = "An interactive, process-aware network monitor for your terminal"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Taylor Wilsdon"}]
keywords = ["network", "monitoring", "tui", "connections"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = ["textual>=8.2.8,<9", "psutil>=7.2.2,<8", "rich>=14.3,<15"]

[project.urls]
Homepage = "https://github.com/taylorwilsdon/netshow"
Issues = "https://github.com/taylorwilsdon/netshow/issues"

[project.scripts]
netshow = "netshow.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
    "mypy>=1.16",
    "types-psutil>=7.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/netshow"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock", "/scripts", "/release.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
